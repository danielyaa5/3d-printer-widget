name: Website
on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/build-site.sh', 'docs/media/**', 'Assets.xcassets/AppIcon.appiconset/**', 'design/icon-concepts/layer-stack.png', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static website
        run: bash scripts/build-site.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
