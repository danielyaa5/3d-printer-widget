name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core and local network tests
        run: swift test --scratch-path build/Core.noindex --enable-code-coverage
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Native feature and layout tests
        run: |
          xcodebuild -project PrintProgress.xcodeproj -scheme PrintProgressFeatureTests \
            -destination 'platform=macOS' -derivedDataPath build/FeatureTests.noindex \
            CODE_SIGNING_ALLOWED=NO test
      - name: Build iPhone app and widget
        run: |
          xcodebuild -project PrintProgress.xcodeproj -scheme PrintProgressIOS \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/iOS.noindex \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify widget action dispatch metadata
        run: python3 scripts/check-widget-intent-metadata.py 'build/iOS.noindex/Build/Products/Debug-iphonesimulator/Print Progress.app'
      - name: iPhone pause resume and stop UI test (fictional demo)
        run: |
          control_test_device="$(python3 - <<'PY'
          import json, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          phones = [d for runtime, entries in devices.items() if 'iOS' in runtime for d in entries if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No available iPhone simulator')
          print(phones[0]['udid'])
          PY
          )"
          trap 'xcrun simctl shutdown "$control_test_device" >/dev/null 2>&1 || true' EXIT
          # Wait for SpringBoard before XCTest asks for its accessibility service.
          xcrun simctl bootstatus "$control_test_device" -b
          open -a Simulator --args -CurrentDeviceUDID "$control_test_device"
          xcodebuild -project PrintProgress.xcodeproj -scheme PrintProgressUITests \
            -destination "platform=iOS Simulator,id=$control_test_device" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/ControlUITests.noindex -resultBundlePath build/UIControls.noindex \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test
      - name: Save iPhone UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-ui-results
          path: build/UIControls.noindex
          retention-days: 7
      - name: Save native UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-renders
          path: build/UIRegression.noindex
          retention-days: 7
